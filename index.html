<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Girl Era Stay Deck</title>
<style>
:root{--fern:#0d3f2a;--gold:#c5a15e;--cream:#fffdf7;--paper:#f7f2e8;--ink:#1f2a24;--muted:#66726a;--sage:#e9eddc;--ok:#1f7a4d;--warn:#a8741a;--bad:#a4452c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
.slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:4vh 4vw;overflow:hidden}
.slide.active{display:flex}
.bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(16px) saturate(.85);transform:scale(1.04)}
.veil{position:absolute;inset:0;background:rgba(247,242,232,.80)}
.slide.dark .veil{background:rgba(13,63,42,.70)}
.card{position:relative;z-index:2;width:min(1200px,100%);max-height:90vh;overflow:auto;background:rgba(255,253,247,.95);border-radius:16px;box-shadow:0 30px 80px rgba(13,63,42,.20);padding:clamp(18px,2.6vw,38px)}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--fern)}
.eyebrow:before{content:"";width:38px;height:1px;background:var(--gold)}
h1,h2{font-family:Georgia,"Times New Roman",serif;color:var(--fern);margin:8px 0 8px;line-height:1.05;font-weight:800}
h1{font-size:clamp(34px,5.4vw,70px)}
h2{font-size:clamp(26px,3.6vw,46px)}
.lead{color:var(--muted);font-size:clamp(14px,1.45vw,18px);line-height:1.45;margin:0 0 14px;max-width:760px}
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800;letter-spacing:.04em;color:#fff;white-space:nowrap}
.badge:before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;opacity:.9}
.s-avail{background:var(--ok)}.s-unk{background:var(--warn)}.s-no{background:var(--bad)}
.grid{display:grid;grid-template-columns:1.02fr 1fr;gap:26px;margin-top:6px}
.pricebox{background:var(--fern);color:#fff;border-radius:12px;padding:14px 18px;margin:4px 0 12px}
.pricebox .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800}
.pricebox .big{font-family:Georgia,serif;font-size:clamp(28px,3.4vw,44px);font-weight:800;line-height:1.1;margin:2px 0}
.pricebox .big small{font-size:14px;font-weight:600;opacity:.8;font-family:inherit}
.pricebox .sub{font-size:13px;line-height:1.4;opacity:.88}
.checkbox{border:1px solid rgba(13,63,42,.16);border-left:4px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45;background:#fff;margin-bottom:12px}
.checkbox b{color:var(--fern)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{border:1px solid rgba(13,63,42,.14);border-radius:10px;padding:10px 12px;background:#fff}
.stat .l{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.stat .v{font-weight:800;color:var(--fern);font-size:16px;margin:2px 0}
.stat .d{font-size:12px;color:var(--muted);line-height:1.35}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
.gal img{width:100%;object-fit:cover;border-radius:10px;display:block;background:var(--sage)}
.gal img:first-child{grid-column:1/-1;height:clamp(170px,30vh,300px)}
.gal img:not(:first-child){height:clamp(80px,14vh,130px)}
.gal.one img:first-child{height:clamp(220px,44vh,420px)}
.gal.two img:not(:first-child){grid-column:1/-1;height:clamp(110px,18vh,170px)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px;font-size:13.5px;line-height:1.5}
.cols b{color:var(--fern)}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-block;text-decoration:none;font-weight:700;font-size:13px;border-radius:999px;padding:9px 16px;border:1px solid var(--fern);color:var(--fern);background:#fff}
.btn.primary{background:var(--fern);color:#fff}
.note{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--gold)}
td{padding:8px;border-bottom:1px solid rgba(13,63,42,.12);vertical-align:middle}
td.n{font-weight:800;color:var(--gold);width:28px}
td b{color:var(--fern)}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:800;color:#fff;white-space:nowrap}
.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}
.node{border:1px solid rgba(13,63,42,.16);border-radius:12px;padding:16px;background:#fff;position:relative}
.node.hl{background:var(--fern);color:#fff;border-color:var(--fern)}
.node .d{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--gold)}
.node .t{font-family:Georgia,serif;font-size:26px;font-weight:800;margin:4px 0}
.node p{margin:0;font-size:13px;line-height:1.45;opacity:.9}
.order{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.order div{border:1px solid rgba(13,63,42,.16);border-radius:10px;padding:12px;background:#fff;font-size:12.5px;color:var(--muted);line-height:1.4}
.order b{display:block;color:var(--fern);font-size:15px;margin-bottom:4px}
.ask{border-left:4px solid #8a9a62;background:rgba(138,154,98,.16);padding:14px 16px;border-radius:0 8px 8px 0;font-size:14px;line-height:1.5}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.brand{position:fixed;top:14px;right:16px;z-index:30;background:var(--fern);border-radius:10px;padding:5px 10px;box-shadow:0 6px 18px rgba(13,63,42,.25)}
.brand img{height:46px;display:block}
.controls{position:fixed;right:18px;bottom:16px;z-index:30;display:flex;gap:10px}
.controls button{width:42px;height:42px;border-radius:50%;border:0;background:rgba(13,63,42,.72);color:#fff;font-size:22px;cursor:pointer}
.counter{position:fixed;left:20px;bottom:20px;z-index:30;font-size:12px;font-weight:700;color:var(--fern);letter-spacing:.08em}
.slide.dark ~ .counter{color:#fff}
@media(max-width:860px){.grid,.cols,.timeline,.stats3{grid-template-columns:1fr}.order{grid-template-columns:1fr 1fr}.brand img{height:34px}.card{max-height:86vh}table{font-size:11.5px}}
</style>
</head>
<body>
<div class="brand"><img src="https://images.squarespace-cdn.com/content/v1/6a1c1ccc06a60a41ffef2eed/5f5a4676-3f45-4798-aab0-9cc10d57671e/Screenshot_2026-07-16_192943-removebg-preview.png?format=1500w" alt="Green Girl Era" referrerpolicy="no-referrer"></div>
<main id="deck"></main>
<div class="counter" id="counter"></div>
<div class="controls"><button id="prev" aria-label="Previous slide">&lsaquo;</button><button id="next" aria-label="Next slide">&rsaquo;</button></div>
<script>
var CK="Checked on Expedia (USD, taxes and fees included, 4 guests) on Oct 6, 2026 for 1 night, Fri Nov 20 to Sat Nov 21.";
var VK="Checked on Vrbo (10 guests) on Oct 6, 2026 for 1 night, Fri Nov 20 to Sat Nov 21.";
var UNK="Not listed for 1 night, Nov 20 to 21. It may be sold out or only bookable direct. Call or email to confirm and ask about a hold. ";
var P=[
{type:"WHOLE-HOME RENTAL",name:"The Studio, Center City",lead:"3 bedrooms, 3 baths, near Reading Terminal Market. Free parking. Rated 9.8.",
 imgs:["https://media.vrbo.com/lodging/125000000/124930000/124922400/124922319/6c3d4b74.jpg","https://media.vrbo.com/lodging/125000000/124930000/124922400/124922319/607701e2.jpg","https://media.vrbo.com/lodging/125000000/124930000/124922400/124922319/653e84c8.jpg"],
 st:"avail",stl:"Available Nov 20 to 21",tag:"Rate for Nov 20 to 21",big:"~$1,600",unit:" total",sub:"CA$2,280 total with taxes and fees for the night, on Vrbo for 10 guests about 0.70 USD per CAD. Free cancellation until Nov 6.",
 chk:"<b>Availability:</b> Vrbo shows the dates as available. "+VK,
 cap:"Sleeps 10",capd:"3 bedrooms, 3 bathrooms, free parking, air conditioning.",fit:"Medium",fitd:"Ask for a discount.",
 why:"The whole house is yours, in the middle of Center City. Easy for a potluck, hot chocolate and pajamas.",
 sp:"Ask the host for a discount in exchange for tagged posts, photos and member referrals. Check that a small gathering is okay.",
 links:[["Open property","https://www.vrbo.com/en-ca/cottage-rental/p5043850vb?chkin=2026-11-20&chkout=2026-11-21&adults=10",1]]},
{type:"WHOLE-HOME RENTAL",name:"Stafford Estate",lead:"Historic 4-bedroom house near St. Joseph&rsquo;s University.",
 imgs:["https://media.vrbo.com/lodging/126000000/125380000/125377200/125377144/121f34c1.jpg","https://media.vrbo.com/lodging/126000000/125380000/125377200/125377144/61f76fe5.jpg","https://media.vrbo.com/lodging/126000000/125380000/125377200/125377144/2e64c32b.jpg"],
 st:"avail",stl:"Available Nov 20 to 21",tag:"Rate for Nov 20 to 21",big:"~$1,635",unit:" total",sub:"CA$2,330 total with taxes and fees for the night, on Vrbo for 10 guests about 0.70 USD per CAD. Full refund if cancelled before Nov 6.",
 chk:"<b>Availability:</b> Vrbo shows the dates as available. "+VK,
 cap:"Sleeps 15",capd:"4 bedrooms, 3+ bathrooms. Pet-friendly.",fit:"Medium",fitd:"Ask for a discount.",
 why:"Big historic rooms with space for a Friendsgiving dinner and a sleepover.",
 sp:"Ask for a discount in exchange for tagged posts and member referrals. The listing says no house parties, so check that a small invite-only gathering is okay.",
 links:[["Open property","https://www.vrbo.com/en-ca/cottage-rental/p5065918vb?chkin=2026-11-20&chkout=2026-11-21&adults=10",1]]},
{type:"WHOLE-HOME RENTAL",name:"University City 7-Bedroom",lead:"7-bedroom house near UPenn with a patio and a kitchenette. Sleeps 19.",
 imgs:["https://media.vrbo.com/lodging/133000000/132820000/132814100/132814079/0f06ab21.jpg","https://media.vrbo.com/lodging/133000000/132820000/132814100/132814079/w1206h793x0y15-0ceb8b90.jpg","https://media.vrbo.com/lodging/133000000/132820000/132814100/132814079/f278cccf.jpg"],
 st:"avail",stl:"Available Nov 20 to 21",tag:"Rate for Nov 20 to 21",big:"~$895",unit:" total",sub:"CA$1,278 total with taxes and fees for the night, on Vrbo for 16 guests about 0.70 USD per CAD. Free cancellation before Nov 6.",
 chk:"<b>Availability:</b> Vrbo shows the dates as available. Checked on Vrbo (16 guests) on Oct 6, 2026 for 1 night, Fri Nov 20 to Sat Nov 21.",
 cap:"Sleeps 19",capd:"7 bedrooms, 2+ bathrooms. Check the bathroom count for a large group.",fit:"Medium",fitd:"Ask for a discount.",
 why:"One roof for everyone, and the lowest total price of the three.",
 sp:"No guest reviews yet. Ask the host for references and check the rules for a group gathering before booking.",
 links:[["Open property","https://www.vrbo.com/en-ca/cottage-rental/p5343464vb?chkin=2026-11-20&chkout=2026-11-21&adults=16",1]]}
];
var GF=["Yes, one home sleeps 10","Yes, one home sleeps 15","Yes, one home sleeps 19"];
var SL={avail:"Available",unk:"Confirm directly",no:"Unavailable"};
function bgDiv(u,dark){return '<div class="bg" style="background-image:url('+u+')"></div><div class="veil"></div>'}
function imgs(a){var c=a.length==1?"one":a.length==2?"two":"";var s='<div class="gal '+c+'">';for(var i=0;i<a.length;i++){s+='<img src="'+a[i]+'" alt="" referrerpolicy="no-referrer" onerror="this.style.display=&quot;none&quot;">'}return s+'</div>'}
function propSlide(p,i){
 var l="";for(var k=0;k<p.links.length;k++){l+='<a class="btn'+(p.links[k][2]?' primary':'')+'" href="'+p.links[k][0+1]+'" target="_blank" rel="noopener">'+p.links[k][0]+'</a>'}
 return '<section class="slide">'+bgDiv(p.imgs[0])+'<article class="card"><div class="head"><div><div class="eyebrow">Option '+(i+1)+' &middot; '+p.type+'</div><h2>'+p.name+'</h2></div></div><p class="lead">'+p.lead+'</p><div class="grid"><div><div class="pricebox"><div class="tag">'+p.tag+'</div><div class="big">'+p.big+'<small>'+p.unit+'</small></div><div class="sub">'+p.sub+'</div></div><div class="stats"><div class="stat"><div class="l">Capacity</div><div class="v">'+p.cap+'</div><div class="d">'+p.capd+'</div><div class="d" style="margin-top:4px"><b>For 10 to 20 guests:</b> '+GF[i]+'</div></div><div class="stat"><div class="l">Sponsor fit</div><div class="v">'+p.fit+'</div><div class="d">'+p.fitd+'</div></div></div></div><div>'+imgs(p.imgs)+'<div class="links">'+l+'</div></div></div><div class="cols"><div><b>Why this one:</b> '+p.why+'</div><div><b>Sponsor ask:</b> '+p.sp+'</div></div></article></section>'}
function cover(){return '<section class="slide dark">'+bgDiv(P[1].imgs[0])+'<article class="card"><div class="eyebrow">Green Girl Era &middot; Philadelphia</div><h1>Friendsgiving Stay Deck</h1><p class="lead">'+P.length+' places to stay on Friday, November 20, for a group of 10 to 20.</p><div class="stats3"><div class="stat"><div class="l">Event</div><div class="v">Girls&rsquo; night in</div><div class="d">Friendsgiving, pajamas, hot chocolate, mimosas</div></div><div class="stat"><div class="l">Group size</div><div class="v">10 to 20 guests</div><div class="d"></div></div><div class="stat"><div class="l">Stay needed</div><div class="v">1 night</div><div class="d">Check in Fri Nov 20, check out Sat Nov 21</div></div></div><p class="note"></p></article></section>'}
function eventSlide(){return '<section class="slide">'+bgDiv(P[0].imgs[0])+'<article class="card"><div class="eyebrow">Event date</div><h2>Friday, November 20, 2026</h2><p class="lead">A girls&rsquo; night in and slumber party with a Friendsgiving celebration. One night: check in November 20, check out November 21.</p><div class="timeline"><div class="node hl"><div class="d">Fri &middot; Nov 20</div><div class="t">Event night</div><p>Check in. Slumber party and Friendsgiving.</p></div><div class="node"><div class="d">Sat &middot; Nov 21</div><div class="t">Check out</div><p>One-night stay ends.</p></div><div class="node"><div class="d">Thu &middot; Nov 26</div><div class="t">Thanksgiving</div><p>One week before the holiday.</p></div></div></article></section>'}
function compare(){var r="";for(var i=0;i<P.length;i++){var p=P[i];r+='<tr><td class="n">'+(i+1)+'</td><td><b>'+p.name+'</b></td><td>'+p.type+'</td><td><b>'+p.big+'</b>'+p.unit+'</td><td>'+p.cap+'</td><td>'+GF[i]+'</td><td>'+p.fit+'</td></tr>'}
 return '<section class="slide">'+bgDiv(P[0].imgs[1])+'<article class="card"><div class="eyebrow">Side by side</div><h2>Options at a Glance</h2><table><thead><tr><th></th><th>Property</th><th>Type</th><th>Rate</th><th>Sleeps</th><th>For 10 to 20 guests</th><th>Sponsor fit</th></tr></thead><tbody>'+r+'</tbody></table><p class="note">Rates are totals for Nov 20 to 21 from Vrbo, at about 0.70 USD per CAD. Confirm before booking.</p></article></section>'}
function recommended(){return '<section class="slide">'+bgDiv(P[2].imgs[0])+'<article class="card"><div class="eyebrow">Contact order</div><h2>Who to Contact First</h2><p class="lead">For a group of 10 to 20, one big house keeps everyone together.</p><div class="order"><div><b>1. Stafford Estate</b>Historic 4-bedroom, sleeps 15. Best fit for the group size.</div><div><b>2. University City 7-Bedroom</b>Sleeps 19, lowest total price. Check the bathroom count and house rules.</div><div><b>3. The Studio</b>Center City home, sleeps 10, free parking. Good if the group stays near 10.</div></div><div class="ask"><b>Sponsor ask:</b> &ldquo;Green Girl Era is hosting a Friendsgiving slumber party for Philadelphia professional women. We’d like a discounted or hosted overnight stay. In return we can offer a shout-out, tagged social posts, email and newsletter mentions, and member referrals.&rdquo;</div><p class="note">Rates change, so confirm with the host before booking.</p></article></section>'}
var S=[cover(),eventSlide(),compare()];for(var i=0;i<P.length;i++){S.push(propSlide(P[i],i))}S.push(recommended());
document.getElementById("deck").innerHTML=S.join("");
var el=document.querySelectorAll(".slide"),cur=0;
function show(n){cur=Math.max(0,Math.min(el.length-1,n));for(var i=0;i<el.length;i++){el[i].classList.toggle("active",i==cur)}document.getElementById("counter").textContent=(cur+1)+" / "+el.length;document.title=(cur+1)+"/"+el.length+" \u00b7 Green Girl Era Stay Deck";try{history.replaceState(null,"","#"+(cur+1))}catch(e){}}
document.getElementById("prev").onclick=function(){show(cur-1)};document.getElementById("next").onclick=function(){show(cur+1)};
document.addEventListener("keydown",function(e){if(e.key=="ArrowRight"||e.key==" "||e.key=="PageDown"){show(cur+1)}else if(e.key=="ArrowLeft"||e.key=="PageUp"){show(cur-1)}});
var tx=null;document.addEventListener("touchstart",function(e){tx=e.touches[0].clientX});document.addEventListener("touchend",function(e){if(tx===null)return;var d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>60){show(cur+(d<0?1:-1))}tx=null});
show((parseInt(location.hash.slice(1))||1)-1);
</script>

</html>
