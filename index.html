<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Girl Era Stay Deck</title>
<style>
:root{--fern:#0d3f2a;--gold:#c5a15e;--cream:#fffdf7;--paper:#f7f2e8;--ink:#1f2a24;--muted:#66726a;--sage:#e9eddc;--ok:#1f7a4d;--warn:#a8741a;--bad:#a4452c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
.slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:4vh 4vw;overflow:hidden}
.slide.active{display:flex}
.bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(16px) saturate(.85);transform:scale(1.04)}
.veil{position:absolute;inset:0;background:rgba(247,242,232,.80)}
.slide.dark .veil{background:rgba(13,63,42,.70)}
.card{position:relative;z-index:2;width:min(1200px,100%);max-height:90vh;overflow:auto;background:rgba(255,253,247,.95);border-radius:16px;box-shadow:0 30px 80px rgba(13,63,42,.20);padding:clamp(18px,2.6vw,38px)}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--fern)}
.eyebrow:before{content:"";width:38px;height:1px;background:var(--gold)}
h1,h2{font-family:Georgia,"Times New Roman",serif;color:var(--fern);margin:8px 0 8px;line-height:1.05;font-weight:800}
h1{font-size:clamp(34px,5.4vw,70px)}
h2{font-size:clamp(26px,3.6vw,46px)}
.lead{color:var(--muted);font-size:clamp(14px,1.45vw,18px);line-height:1.45;margin:0 0 14px;max-width:760px}
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800;letter-spacing:.04em;color:#fff;white-space:nowrap}
.badge:before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;opacity:.9}
.s-avail{background:var(--ok)}.s-unk{background:var(--warn)}.s-no{background:var(--bad)}
.grid{display:grid;grid-template-columns:1.02fr 1fr;gap:26px;margin-top:6px}
.pricebox{background:var(--fern);color:#fff;border-radius:12px;padding:14px 18px;margin:4px 0 12px}
.pricebox .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800}
.pricebox .big{font-family:Georgia,serif;font-size:clamp(28px,3.4vw,44px);font-weight:800;line-height:1.1;margin:2px 0}
.pricebox .big small{font-size:14px;font-weight:600;opacity:.8;font-family:inherit}
.pricebox .sub{font-size:13px;line-height:1.4;opacity:.88}
.checkbox{border:1px solid rgba(13,63,42,.16);border-left:4px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45;background:#fff;margin-bottom:12px}
.checkbox b{color:var(--fern)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{border:1px solid rgba(13,63,42,.14);border-radius:10px;padding:10px 12px;background:#fff}
.stat .l{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.stat .v{font-weight:800;color:var(--fern);font-size:16px;margin:2px 0}
.stat .d{font-size:12px;color:var(--muted);line-height:1.35}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
.gal img{width:100%;object-fit:cover;border-radius:10px;display:block;background:var(--sage)}
.gal img:first-child{grid-column:1/-1;height:clamp(170px,30vh,300px)}
.gal img:not(:first-child){height:clamp(80px,14vh,130px)}
.gal.one img:first-child{height:clamp(220px,44vh,420px)}
.gal.two img:not(:first-child){grid-column:1/-1;height:clamp(110px,18vh,170px)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px;font-size:13.5px;line-height:1.5}
.cols b{color:var(--fern)}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-block;text-decoration:none;font-weight:700;font-size:13px;border-radius:999px;padding:9px 16px;border:1px solid var(--fern);color:var(--fern);background:#fff}
.btn.primary{background:var(--fern);color:#fff}
.note{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--gold)}
td{padding:8px;border-bottom:1px solid rgba(13,63,42,.12);vertical-align:middle}
td.n{font-weight:800;color:var(--gold);width:28px}
td b{color:var(--fern)}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:800;color:#fff;white-space:nowrap}
.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}
.node{border:1px solid rgba(13,63,42,.16);border-radius:12px;padding:16px;background:#fff;position:relative}
.node.hl{background:var(--fern);color:#fff;border-color:var(--fern)}
.node .d{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--gold)}
.node .t{font-family:Georgia,serif;font-size:26px;font-weight:800;margin:4px 0}
.node p{margin:0;font-size:13px;line-height:1.45;opacity:.9}
.order{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.order div{border:1px solid rgba(13,63,42,.16);border-radius:10px;padding:12px;background:#fff;font-size:12.5px;color:var(--muted);line-height:1.4}
.order b{display:block;color:var(--fern);font-size:15px;margin-bottom:4px}
.ask{border-left:4px solid #8a9a62;background:rgba(138,154,98,.16);padding:14px 16px;border-radius:0 8px 8px 0;font-size:14px;line-height:1.5}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.brand{position:fixed;top:14px;right:16px;z-index:30;background:var(--fern);border-radius:10px;padding:5px 10px;box-shadow:0 6px 18px rgba(13,63,42,.25)}
.brand img{height:46px;display:block}
.controls{position:fixed;right:18px;bottom:16px;z-index:30;display:flex;gap:10px}
.controls button{width:42px;height:42px;border-radius:50%;border:0;background:rgba(13,63,42,.72);color:#fff;font-size:22px;cursor:pointer}
.counter{position:fixed;left:20px;bottom:20px;z-index:30;font-size:12px;font-weight:700;color:var(--fern);letter-spacing:.08em}
.slide.dark ~ .counter{color:#fff}
@media(max-width:860px){.grid,.cols,.timeline,.stats3{grid-template-columns:1fr}.order{grid-template-columns:1fr 1fr}.brand img{height:34px}.card{max-height:86vh}table{font-size:11.5px}}
</style>
</head>

 return '<section class="slide">'+bgDiv(P[0].imgs[1])+'<article class="card"><div class="eyebrow">Side by side</div><h2>Options at a Glance</h2><table><thead><tr><th></th><th>Property</th><th>Type</th><th>Rate</th><th>Sleeps</th><th>For 10 to 20 guests</th><th>Area</th></tr></thead><tbody>'+r+'</tbody></table><p class="note">Prices are for the night of Nov 20 to 21 in USD, with all fees included, from Vrbo and Airbnb. Confirm with the host before booking.</p></article></section>'}
